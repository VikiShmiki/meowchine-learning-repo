[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-recycling-access"
version = "0.1.0"
description = "Recycling guidance and infrastructure access planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pillow>=11,<13",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5,<6",
  "torch>=2,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
geo = [
  "networkx>=3.4,<4",
  "numpy>=1.26,<3",
  "osmium>=4.0,<5",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "scipy>=1.14,<2",
  "shapely>=2.1,<3",
]
dev = [
  "playwright>=1.55,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
data = [
  "datasets>=4,<5",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5,<6",
  "torch>=2,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
